services:
  sitl:
    image: ubcuas/uasitl:copter-4.5.5
    platform: linux/amd64
    # Optional for local debugging; CI doesn't need ports published.
    ports:
      - "5760:5760"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5760)); s.close();\""]
      interval: 5s
      timeout: 3s
      retries: 60

  mavproxy:
    build: 
      context: ./projects/mavproxy
      dockerfile: Dockerfile
    container_name: mavproxy
    tty: true
    stdin_open: true
    depends_on:
      sitl:
        condition: service_healthy
    ports:
      - "14550:14550/udp"
      - "14551:14551/udp"
    command: > 
      mavproxy.py 
      --master=tcp:sitl:5760 
      --out=udpin:0.0.0.0:14550 
      --out=udpin:0.0.0.0:14551
      --default-modules=link,output,mode
      --nowait
      --daemon
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys; sys.exit(0 if any('mavproxy' in open(f'/proc/{p}/cmdline', 'rb').read().decode('utf-8', errors='ignore') for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')) else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mission-planner:
    build:
      context: ./projects/mission-planner
      dockerfile: Dockerfile
    environment:
      # mission-planner currently hardcodes these defaults, but we set them for
      # future compatibility if main.py is parameterized later.
      - HOST=0.0.0.0
      - PORT=9000
      - MAVLINK_CONNECTION_STRING=udpout:mavproxy:14550
      - STATUS_HOST=web-backend
      - STATUS_PORT=8000
    depends_on:
      mavproxy:
        condition: service_healthy
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/', timeout=2).read();\""]
      interval: 5s
      timeout: 3s
      retries: 60

  web-backend:
    build:
      context: ./projects/web-backend
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/src
      - PATH=/root/.local/bin:$PATH
      # If web-backend reads mission-planner URL from env, this makes the whole
      # stack self-contained.
      - SECRET_KEY="django-insecure-e27f6@t)*9q#vtf*v*hkl-2+86$&6ayj9fb+j+b-5_bjhne$h@"
      - DEBUG=True
      - MISSION_PLANNER_URL=http://mission-planner:9000
    depends_on:
      - mission-planner
    ports:
      - "8000:8000"
    volumes:
      - ./projects/web-backend:/backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/drone/status', timeout=2).read();\""]
      interval: 5s
      timeout: 3s
      retries: 60

    
  web-frontend:
    build:
      context: ./projects/web-frontend
      dockerfile: Dockerfile
    ports:
      - "1324:1324" 
    volumes:
      # Bind mount host directory for React HMR
      - ./projects/web-frontend:/frontend
      # Protect container node_modules from being overwritten by host
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ensures HMR triggers across virtualized filesystems
      - VITE_MAPTILER_KEY=ioE7W2lCif3DO9oj1YJh
      - VITE_SIGNALING_SERVER_URL=ws://localhost:8081

