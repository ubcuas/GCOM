[tool.poetry]
name = "gcom"
version = "0.1.0"
description = "Ground Control Software Rewrite"
authors = ["21chanas3 <adenchan@gmail.com>"]
readme = "README.md"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.0.6"
django-rest-framework = "^0.1.0"
django-polymorphic = "^3.1.0"
drf-spectacular = "^0.27.2"
pillow = "^10.3.0"
requests = "^2.32.3"
channels = "^4.1.0"
boto3 = "^1.35.0"
daphne = "^4.1.2"
uvicorn = "^0.30.6"
python-socketio = "^5.11.4"
websockets = "^13.1"
django-cors-headers = "^4.5.0"
asgiref = "^3.8.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
]
ignore = [
    "E501",  # line too long (handled by black/ruff-format)
    "E402",  # imports not at top (common with sys.path manipulation)
    "E722",  # bare except (common in test helpers/waiters)
    "F403",  # star imports
    "F405",  # undefined names from star imports
]
